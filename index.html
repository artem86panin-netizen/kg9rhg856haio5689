<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Список покупок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --danger: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 640px; margin: 0 auto; }
  header { flex: none; padding: 12px 14px 6px; }
  h1 { margin: 0; font-size: 20px; }
  .sub { color: var(--hint); font-size: 13px; min-height: 16px; margin-top: 2px; }
  .banner { display: none; margin: 8px 14px 0; padding: 10px 12px; border-radius: 12px; background: var(--card); color: var(--danger); font-size: 14px; }
  .banner.show { display: block; }

  #scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 8px 16px; }
  #wrap { position: relative; }
  ul { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 6px; padding: 6px 4px 6px 0; border-bottom: 1px solid var(--card); background: var(--bg); }
  .row.depth1 { padding-left: 34px; }
  .row.target { background: var(--card); border-radius: 10px; }
  .grip { flex: none; width: 34px; height: 44px; border: 0; background: transparent; color: var(--hint); display: grid; place-items: center; padding: 0; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .body { flex: 1; min-width: 0; padding: 6px 4px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .text { font-size: 16px; word-break: break-word; }
  .meta { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .row.done .text { text-decoration: line-through; color: var(--hint); }
  .chk { flex: none; width: 36px; height: 36px; border-radius: 9px; border: 2px solid var(--hint); background: transparent; color: transparent; font-size: 20px; line-height: 1; display: grid; place-items: center; padding: 0; margin-right: 2px; }
  .row.done .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .del { flex: none; border: 0; background: transparent; color: var(--hint); font-size: 22px; padding: 6px 8px; }
  .row.dragging { opacity: .3; }
  .row.ghost { position: fixed; z-index: 50; pointer-events: none; opacity: .97; box-shadow: 0 6px 18px rgba(0,0,0,.25); border-radius: 12px; border-bottom: 0; }
  #dropline { position: absolute; right: 8px; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; z-index: 20; transform: translateY(-1px); }
  .empty { text-align: center; color: var(--hint); padding: 40px 12px; font-size: 15px; }
  .sect { display: flex; align-items: center; justify-content: space-between; margin: 18px 4px 4px; color: var(--hint); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .sect .l { border: 0; background: transparent; color: var(--hint); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 0; }
  .sect .r { border: 0; background: transparent; color: var(--accent); font-size: 14px; text-transform: none; letter-spacing: 0; padding: 6px 0; }
  .hint { color: var(--hint); font-size: 12px; text-align: center; margin: 18px 12px 4px; line-height: 1.4; }

  #bar { flex: none; background: var(--bg); border-top: 1px solid var(--card); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); }
  #chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; padding: 6px 10px; border-radius: 10px; background: var(--card); font-size: 13px; }
  #chip[hidden] { display: none; }
  #chip b { font-weight: 600; }
  #chip button { border: 0; background: transparent; color: var(--hint); font-size: 18px; padding: 0 4px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; font-size: 16px; padding: 12px 14px; border-radius: 14px; border: 1px solid transparent; background: var(--card); color: var(--fg); outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  .add { flex: none; width: 48px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-fg); font-size: 26px; line-height: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🛒 Список покупок</h1>
    <div class="sub" id="sub"></div>
  </header>
  <div class="banner" id="banner"></div>
  <div id="scroll">
    <div id="wrap">
      <ul id="todo"></ul>
      <div id="dropline" hidden></div>
    </div>
    <div id="empty" class="empty" hidden>Список порожній.<br>Додайте першу покупку внизу ↓</div>
    <div class="sect" id="doneHead" hidden>
      <button class="l" id="doneToggle" type="button"><span id="doneArrow">▾</span> <span id="doneTitle">Виконано</span></button>
      <button class="r" id="clear" type="button">Очистити</button>
    </div>
    <ul id="done"></ul>
    <div class="hint" id="hint" hidden>Торкніться пункту — додати до нього підпункти.<br>Потягніть за ⠿ — змінити порядок; вправо — зробити підпунктом.<br>Утримуйте пункт — видалити.</div>
  </div>
  <div id="bar">
    <div id="chip" hidden><span>↳ Підпункт до «<b id="chipName"></b>»</span><button id="chipX" type="button" aria-label="Скасувати">✕</button></div>
    <form id="form" autocomplete="off">
      <input type="text" id="input" placeholder="Що купити?" maxlength="120" enterkeyhint="done">
      <button class="add" type="submit" aria-label="Додати">+</button>
    </form>
  </div>
</div>

<script>
// ============ НАЛАШТУВАННЯ: змініть цей рядок ============
const CONFIG = {
  API_URL: 'https://limbonik.duckdns.org/webhook/shopping-api',  // Production URL вебхука з n8n
  DEFAULT_CHAT_ID: '-1004297293695',                         // група за замовчуванням (коли відкрито не з групи)
  POLL_MS: 8000
};
// ==========================================================

// <pure>
function byPos(a, b) { return (a.pos - b.pos) || String(a.id).localeCompare(String(b.id)); }
function buildTree(items) {
  const active = items.filter(i => !i.done);
  const rootIds = new Set(active.filter(i => !i.parentId).map(i => i.id));
  const roots = active.filter(i => !i.parentId || !rootIds.has(i.parentId)).sort(byPos);
  const kidsOf = {};
  active.forEach(i => { if (i.parentId && rootIds.has(i.parentId)) (kidsOf[i.parentId] = kidsOf[i.parentId] || []).push(i); });
  Object.keys(kidsOf).forEach(k => kidsOf[k].sort(byPos));
  return { roots, kidsOf };
}
function computePos(items, parent, before, excl) {
  const s = items.filter(i => (i.parentId || '') === parent && i.id !== excl).sort(byPos);
  if (!s.length) return 1;
  const idx = before ? s.findIndex(i => i.id === before) : -1;
  if (idx === -1) return s[s.length - 1].pos + 1;
  if (idx === 0) return s[0].pos - 1;
  return (s[idx - 1].pos + s[idx].pos) / 2;
}
function applyMove(items, id, parent, before) {
  const pos = computePos(items, parent, before, id);
  return items.map(i => i.id === id ? Object.assign({}, i, { parentId: parent, pos }) : i);
}
function applyToggle(items, id, done) {
  const it = items.find(i => i.id === id);
  if (!it) return items;
  return items.map(i => {
    if (i.id === id) return Object.assign({}, i, { done, doneBy: done ? 'ви' : '' });
    if (done && !it.parentId && i.parentId === id && !i.done) return Object.assign({}, i, { done: true, doneBy: 'ви' });
    if (!done && it.parentId && i.id === it.parentId && i.done) return Object.assign({}, i, { done: false, doneBy: '' });
    return i;
  });
}
function applyDelete(items, id) {
  const it = items.find(i => i.id === id);
  if (!it) return items;
  return items.filter(i => i.id !== id && !(!it.parentId && i.parentId === id));
}
// rows: рядки БЕЗ того, що перетягується: {id, depth, parent, top, bottom}
function dropTarget(rows, y, dx, drag) {
  let k = -1;
  for (let i = 0; i < rows.length; i++) { if ((rows[i].top + rows[i].bottom) / 2 < y) k = i; else break; }
  let A = k >= 0 ? rows[k] : null;
  let B = k + 1 < rows.length ? rows[k + 1] : null;
  const rootOfA = A ? (A.depth ? A.parent : A.id) : null;
  const bChild = !!(B && B.depth === 1);
  const allow1 = !drag.hasKids && !!rootOfA && (!bChild || B.parent === rootOfA);
  let want = dx > 28 ? 1 : (dx < -28 ? 0 : drag.depth);
  if (want === 1 && !allow1) want = 0;
  if (want === 0 && bChild) {
    let i = k + 1;
    while (i < rows.length && rows[i].depth === 1) i++;
    A = rows[i - 1]; B = rows[i] || null;
  }
  if (want === 1) return { depth: 1, parent: rootOfA, before: bChild ? B.id : '', lineAfter: A ? A.id : null };
  return { depth: 0, parent: '', before: B ? B.id : '', lineAfter: A ? A.id : null };
}
function currentPlace(items, id) {
  const tree = buildTree(items);
  const it = items.find(i => i.id === id);
  const isChild = !!(it && it.parentId && tree.kidsOf[it.parentId] && tree.kidsOf[it.parentId].some(k => k.id === id));
  const sib = isChild ? tree.kidsOf[it.parentId] : tree.roots;
  const idx = sib.findIndex(s => s.id === id);
  return { parent: isChild ? it.parentId : '', before: (idx >= 0 && idx + 1 < sib.length) ? sib[idx + 1].id : '' };
}
// </pure>

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : '';
const sp = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : '';
const chatId = /^-?\d+$/.test(sp || '') ? sp : CONFIG.DEFAULT_CHAT_ID;

const $ = id => document.getElementById(id);
const app = $('app'), scroller = $('scroll'), wrap = $('wrap'), todoEl = $('todo'), doneEl = $('done'), line = $('dropline');
let items = [], inflight = 0, tmp = 0, dragging = false, targetParent = '', doneOpen = true;
try { doneOpen = localStorage.getItem('doneOpen') !== '0'; } catch (e) {}

function fit() { if (tg && tg.viewportHeight) app.style.height = tg.viewportHeight + 'px'; }
if (tg && tg.onEvent) tg.onEvent('viewportChanged', fit);
fit();

const ERR = {
  no_init_data: 'Відкрийте список з Telegram — кнопкою в боті.',
  bad_signature: 'Не вдалося підтвердити вхід. Відкрийте список знову з Telegram.',
  expired: 'Сесія застаріла. Закрийте і відкрийте список знову.',
  not_member: 'Список доступний лише учасникам групи.',
  too_many: 'Занадто багато позицій у списку.',
  not_found: 'Позицію вже змінено або видалено — оновлюю список.',
  bad_parent: 'Сюди підпункт додати не можна — оновлюю список.',
  has_children: 'Пункт з підпунктами не можна зробити підпунктом.'
};
function showError(code) {
  const b = $('banner');
  if (!code) { b.classList.remove('show'); return; }
  b.textContent = ERR[code] || 'Немає зв’язку з сервером. Спробуйте ще раз.';
  b.classList.add('show');
}
function haptic(k) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} }
function confirmBox(q, yes) {
  if (tg && tg.showConfirm) tg.showConfirm(q, ok => { if (ok) yes(); });
  else if (confirm(q)) yes();
}

async function api(action, extra) {
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },   // «проста» CORS-вимога, без preflight
    body: JSON.stringify(Object.assign({ initData, chatId, action }, extra || {}))
  });
  const data = await res.json();
  if (!data.ok) { const e = new Error(data.error || 'error'); e.code = data.error; throw e; }
  return data;
}

const GRIP = '<svg width="14" height="20" viewBox="0 0 14 20" aria-hidden="true"><g fill="currentColor"><circle cx="3.5" cy="4" r="1.7"/><circle cx="10.5" cy="4" r="1.7"/><circle cx="3.5" cy="10" r="1.7"/><circle cx="10.5" cy="10" r="1.7"/><circle cx="3.5" cy="16" r="1.7"/><circle cx="10.5" cy="16" r="1.7"/></g></svg>';

function makeRow(item, opts) {
  const el = document.createElement('li');
  el.className = 'row' + (opts.depth ? ' depth1' : '') + (item.done ? ' done' : '') + (item.id === targetParent ? ' target' : '');
  el.dataset.id = item.id; el.dataset.depth = String(opts.depth || 0); el.dataset.parent = opts.parent || '';
  if (!item.done) {
    const grip = document.createElement('button');
    grip.className = 'grip'; grip.type = 'button'; grip.innerHTML = GRIP; grip.setAttribute('aria-label', 'Перемістити');
    grip.addEventListener('pointerdown', ev => startDrag(ev, grip, el, item));
    el.appendChild(grip);
  }
  const body = document.createElement('div'); body.className = 'body';
  const text = document.createElement('div'); text.className = 'text'; text.textContent = item.text;
  const meta = document.createElement('div'); meta.className = 'meta';
  if (item.done) {
    const parent = item.parentId ? items.find(i => i.id === item.parentId) : null;
    meta.textContent = (parent ? '↳ ' + parent.text + ' · ' : '') + 'куплено: ' + (item.doneBy || '—');
  } else meta.textContent = item.addedBy ? 'додав(ла): ' + item.addedBy : '';
  body.append(text, meta);
  if (!item.done) bindBody(body, item);
  el.appendChild(body);
  if (item.done) {
    const del = document.createElement('button');
    del.className = 'del'; del.type = 'button'; del.textContent = '×'; del.setAttribute('aria-label', 'Видалити');
    del.onclick = () => removeItem(item);
    el.appendChild(del);
  }
  const chk = document.createElement('button');
  chk.className = 'chk'; chk.type = 'button'; chk.textContent = '✓';
  chk.setAttribute('aria-label', item.done ? 'Повернути в список' : 'Відмітити виконаним');
  chk.onclick = () => toggleItem(item.id, !item.done);
  el.appendChild(chk);
  return el;
}

// тап по тексту — вибрати «батьківський» пункт; утримання — видалити
function bindBody(body, item) {
  let timer = null, fired = false, sx = 0, sy = 0;
  body.addEventListener('pointerdown', ev => {
    fired = false; sx = ev.clientX; sy = ev.clientY;
    timer = setTimeout(() => { fired = true; haptic('medium'); removeItem(item); }, 600);
  });
  const cancel = () => { clearTimeout(timer); };
  body.addEventListener('pointermove', ev => { if (Math.abs(ev.clientX - sx) > 8 || Math.abs(ev.clientY - sy) > 8) cancel(); });
  body.addEventListener('pointerup', cancel);
  body.addEventListener('pointercancel', cancel);
  body.addEventListener('contextmenu', ev => ev.preventDefault());
  body.addEventListener('click', () => {
    if (fired) return;
    const id = item.parentId && items.some(i => i.id === item.parentId && !i.done) ? item.parentId : item.id;
    setTarget(targetParent === id ? '' : id);
  });
}

function setTarget(id) {
  targetParent = id;
  const it = items.find(i => i.id === id);
  $('chip').hidden = !it;
  $('chipName').textContent = it ? it.text : '';
  $('input').placeholder = it ? 'Підпункт…' : 'Що купити?';
  render();
  if (it) $('input').focus();
}
$('chipX').onclick = () => setTarget('');

function render() {
  const tree = buildTree(items);
  if (targetParent && !tree.roots.some(r => r.id === targetParent)) { targetParent = ''; $('chip').hidden = true; $('input').placeholder = 'Що купити?'; }
  const frag = [];
  tree.roots.forEach(r => {
    frag.push(makeRow(r, { depth: 0 }));
    (tree.kidsOf[r.id] || []).forEach(k => frag.push(makeRow(k, { depth: 1, parent: r.id })));
  });
  todoEl.replaceChildren(...frag);
  const done = items.filter(i => i.done).sort(byPos);
  doneEl.replaceChildren(...(doneOpen ? done.map(d => makeRow(d, { depth: 0 })) : []));
  $('doneHead').hidden = done.length === 0;
  $('doneTitle').textContent = 'Виконано · ' + done.length;
  $('doneArrow').textContent = doneOpen ? '▾' : '▸';
  $('empty').hidden = items.length > 0;
  $('hint').hidden = items.length === 0;
  const left = items.filter(i => !i.done).length;
  $('sub').textContent = items.length ? ('Лишилось: ' + left + ' з ' + items.length) : '';
}

async function load(silent) {
  if (inflight > 0 || dragging) return;
  try {
    const data = await api('list');
    if (inflight === 0 && !dragging) { items = data.items; render(); }
    showError(null);
  } catch (e) { if (!silent || e.code) showError(e.code || 'net'); }
}
async function mutate(action, payload, optimistic) {
  const backup = items;
  if (optimistic) { items = optimistic(items); render(); }
  inflight++;
  try {
    const data = await api(action, payload);
    inflight--;
    if (inflight === 0) { items = data.items; render(); }
    showError(null);
  } catch (e) {
    inflight--;
    if (inflight === 0) items = backup;
    render();
    showError(e.code || 'net');
    if (e.code === 'not_found' || e.code === 'bad_parent') load();
  }
}

function toggleItem(id, done) { haptic('light'); mutate('toggle', { id, done }, l => applyToggle(l, id, done)); }
function removeItem(item) {
  confirmBox('Видалити «' + item.text + '»' + (!item.parentId && !item.done && items.some(i => i.parentId === item.id) ? ' разом з підпунктами' : '') + '?',
    () => { haptic('medium'); mutate('delete', { id: item.id }, l => applyDelete(l, item.id)); });
}
$('clear').onclick = () => confirmBox('Прибрати всі виконані позиції зі списку?', () => mutate('clear_done', {}, l => l.filter(i => !i.done)));
$('doneToggle').onclick = () => { doneOpen = !doneOpen; try { localStorage.setItem('doneOpen', doneOpen ? '1' : '0'); } catch (e) {} render(); };

$('form').addEventListener('submit', ev => {
  ev.preventDefault();
  const v = $('input').value.trim();
  if (!v) return;
  $('input').value = '';
  haptic('light');
  const parent = targetParent;
  mutate('add', { text: v, parentId: parent }, l => {
    let out = l.slice();
    v.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(s => {
      out.push({ id: 'tmp' + (++tmp), text: s, done: false, parentId: parent, pos: computePos(out, parent, '', ''), addedBy: 'ви' });
    });
    return out;
  });
  setTimeout(() => { scroller.scrollTop = scroller.scrollHeight; }, 30);
});

// ---------- перетягування ----------
function startDrag(ev, grip, rowEl, item) {
  if (ev.button !== undefined && ev.button !== 0 && ev.pointerType === 'mouse') return;
  ev.preventDefault();
  dragging = true;
  haptic('light');
  const tree = buildTree(items);
  const hasKids = !item.parentId && (tree.kidsOf[item.id] || []).length > 0;
  const group = [rowEl];
  if (hasKids) todoEl.querySelectorAll('li.row[data-parent="' + item.id + '"]').forEach(e => group.push(e));
  group.forEach(e => e.classList.add('dragging'));
  const rect = rowEl.getBoundingClientRect();
  const ghost = rowEl.cloneNode(true);
  ghost.classList.remove('dragging'); ghost.classList.add('ghost');
  ghost.style.width = rect.width + 'px'; ghost.style.left = rect.left + 'px'; ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  const offY = ev.clientY - rect.top;
  const st = { x0: ev.clientX, x: ev.clientX, y: ev.clientY };
  const depth0 = Number(rowEl.dataset.depth);
  let target = null, raf = 0;
  try { grip.setPointerCapture(ev.pointerId); } catch (e) {}

  function rowsInfo() {
    return Array.from(todoEl.querySelectorAll('li.row')).filter(e => group.indexOf(e) === -1).map(e => {
      const r = e.getBoundingClientRect();
      return { id: e.dataset.id, depth: Number(e.dataset.depth), parent: e.dataset.parent, top: r.top, bottom: r.bottom };
    });
  }
  function update() {
    ghost.style.top = (st.y - offY) + 'px';
    const rows = rowsInfo();
    target = dropTarget(rows, st.y, st.x - st.x0, { hasKids, depth: depth0 });
    const wr = wrap.getBoundingClientRect();
    let top = 0;
    if (target.lineAfter) { const r = rows.find(x => x.id === target.lineAfter); if (r) top = r.bottom - wr.top; }
    else if (rows.length) top = rows[0].top - wr.top;
    line.hidden = false;
    line.style.top = top + 'px';
    line.style.left = (target.depth ? 42 : 4) + 'px';
  }
  function tick() {
    const sr = scroller.getBoundingClientRect();
    let dy = 0;
    if (st.y < sr.top + 60) dy = -10; else if (st.y > sr.bottom - 40) dy = 10;
    if (dy) { scroller.scrollTop += dy; update(); }
    raf = requestAnimationFrame(tick);
  }
  function onMove(e) { st.x = e.clientX; st.y = e.clientY; update(); }
  function finish(apply) {
    grip.removeEventListener('pointermove', onMove);
    grip.removeEventListener('pointerup', onUp);
    grip.removeEventListener('pointercancel', onCancel);
    cancelAnimationFrame(raf);
    ghost.remove(); line.hidden = true;
    group.forEach(e => e.classList.remove('dragging'));
    dragging = false;
    if (apply && target) {
      const cur = currentPlace(items, item.id);
      if (cur.parent !== target.parent || cur.before !== target.before) {
        haptic('medium');
        mutate('move', { id: item.id, parentId: target.parent, beforeId: target.before }, l => applyMove(l, item.id, target.parent, target.before));
      }
    }
  }
  function onUp() { finish(true); }
  function onCancel() { finish(false); }
  grip.addEventListener('pointermove', onMove);
  grip.addEventListener('pointerup', onUp);
  grip.addEventListener('pointercancel', onCancel);
  update();
  raf = requestAnimationFrame(tick);
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(true); });
setInterval(() => { if (document.visibilityState === 'visible') load(true); }, CONFIG.POLL_MS);
if (!initData) showError('no_init_data'); else load(false);
</script>
</body>
